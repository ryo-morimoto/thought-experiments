# タグを打ったときだけ、「このコミットのリポジトリがデータ利用ポリシー検査に通った」ことを
# Sigstore で署名し、公開の透明性ログに記録する。
# 第三者による検証（署名対象は圧縮しない tar なので、どの git でも同じバイト列を再現できる）:
#   git archive --format=tar -o repo.tar <tag>
#   gh attestation verify repo.tar --repo ryo-morimoto/thought-experiments \
#     --predicate-type https://github.com/ryo-morimoto/thought-experiments/data-policy-check/v1
name: attest

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/check_data_policy.py --report data-policy-report.json
      - run: |
          git archive --format=tar -o "repo-${GITHUB_REF_NAME}.tar" HEAD
          sha256sum "repo-${GITHUB_REF_NAME}.tar"
      - uses: actions/attest@v4
        with:
          subject-path: repo-${{ github.ref_name }}.tar
          # 予測型 URL に '_' を含めると GitHub API の絞り込みで 422 になるので使わない
          predicate-type: https://github.com/${{ github.repository }}/data-policy-check/v1
          predicate-path: data-policy-report.json
