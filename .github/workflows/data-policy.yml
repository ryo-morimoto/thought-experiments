name: data-policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 全ファイルにライセンス宣言があるか（網羅性）
      - uses: fsfe/reuse-action@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 出所・ライセンス義務・証拠（ハッシュとタイムスタンプ）
      - run: python3 tools/check_data_policy.py
      # te 形式の思考実験の記録：te.lock の版を取得して照合し、experiments/ 以下を te check する
      - run: python3 tools/te_check.py
