# データ利用ポリシーの機械可読な設定。DATA_POLICY.md の「表明」を実装するもの。
# ライセンスを追加するときは、本文を読んで二次利用（複製・加工・再配布）が
# 許されていることを確かめてから、単独のコミットで追加する。

# SOURCE.toml として扱わないもの（雛形）。
ignore_sources = ["templates/**"]

# 自作物とみなすファイル。これ以外のファイルはすべて「データ」とみなし、SOURCE.toml の管轄下にしか置けない。
# データの拡張子を列挙する方式だと、拡張子を変えるだけ（.csv → .txt）で検査をすり抜けられるため、こちらを許可リストにする。
# ルートの REUSE.toml はここから生成される（自作物だけに CC0 を宣言し、それ以外を一括で宣言しない）。
[own]
extensions = ["md", "py", "toml"]
paths = [
  ".gitignore",
  ".githooks/**",
  ".github/**",
  "LICENSES/**",    # REUSE が要求するライセンス本文（REUSE 自体の検査対象外）
  "templates/LICENSES/**",  # 13条などの説明文の雛形（.toml の雛形は拡張子で自作物になる）
]

# 著作権法13条（権利の目的とならない著作物）として扱うデータの条件。
#   items:           SOURCE.toml の art13_item に書ける号（1 法令 / 2 告示等 / 3 判決等 / 4 国等が作成した翻訳物・編集物）
#   publisher_types: 13条の作成主体（国・地方公共団体の機関、独立行政法人、地方独立行政法人）に当たる種別
#   hosts:           取得元として認めるホスト。公的機関が直接運営し、サイト規約に求償条項がないことを確認したものだけ。
#                    民間事業者が運営する例規集（編集物・独自規約がある）は入れない。追加は理由を書いた単独のコミットにする。
[art13]
items = [1, 2, 3, 4]
publisher_types = ["government", "local-government", "public-institution"]

[art13.hosts]
"laws.e-gov.go.jp" = "e-Gov 法令検索（デジタル庁）"
"www.city.edogawa.tokyo.jp" = "江戸川区公式サイト。「著作権・リンク」に求償条項なし（2026-11-21 確認）"

# 自作物の著作権表示とライセンス。REUSE.toml の生成に使う。
# 対象: SOURCE.toml の管轄外のファイルと、各データディレクトリの宣言・証拠ファイル。
[self]
copyright = "2026 ryo-morimoto"
license = "CC0-1.0"

# RFC 3161 タイムスタンプ局。証拠マニフェストに時刻証明を付ける。
# 証明書は他人のファイルなのでコミットせず、検査のたびに取得して sha256 で照合する。
[tsa]
url = "https://freetsa.org/tsr"
cafile = { url = "https://freetsa.org/files/cacert.pem", sha256 = "2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438" }
untrusted = { url = "https://freetsa.org/files/tsa.crt", sha256 = "8bfb0305bb64e2571ca507552ef3245cb1c2fee8728e0ff8689225081ea13467" }

# 自作物のファイルに埋め込まれたデータ（表・数値の並び）の検出。tools/embedded_data.py を参照。
[embedded]
min_rows = 10        # この行数以上の表・CSV らしい行・数値の行の連続をデータとみなす
min_numbers = 50     # 1 行にこの個数以上の数値があればデータとみなす
skip = ["LICENSES/**"]

# 外部データの提供者として認める種別。提供者が権利者であることは証明できないので、
# 説明責任を負う組織に限ることで、誤ったライセンス表示を受け取る確率を下げる。
# 追加するときは、ライセンスと同じく理由を書いた単独のコミットにする。
[publisher_types]
government = "国の行政機関"
local-government = "地方公共団体"
intergovernmental = "国際機関"
academic = "大学・研究機関（機関として公開しているもの）"
public-institution = "独立行政法人・公的な図書館や博物館など"

# 利用規約。ライセンスの条文とは別に、提供者が定める規約（付帯条件・免責・求償など）を登録する。
# 外部データの SOURCE.toml は terms = "<id>" でここを参照し、license_url は url と一致させる。
#   base_license:      規約が採用するライセンス（SOURCE.toml の license と一致すること）
#   non_copyrightable: 著作物でないデータ（数値・簡単な表など）に規約を "applies"（適用する）/ "excluded"（適用しない）
#   indemnity:         利用者に提供者の費用を弁償させる条項（求償条項）があるか
#   deemed_consent:    利用をもって同意とみなす条項があるか
#   unilateral_change: 予告なく変更する条項があるか
# 規約を追加するときは本文を読み、確認した日と根拠を書いた単独のコミットにする。
[terms_policy]
# 求償条項のある規約のデータは使わない。提供者側の誤表示（第三者の権利の混入）のリスクが
# 利用者個人に移るため（思考実験「著作物でないデータに、ライセンスの義務は及ぶか」の S3）。
allow_indemnity = false
# 著作物でないデータにも条件を課す規約は許可する（条件を守ればよい。記録だけする）。
allow_non_copyrightable_applies = true

[terms."cc-license-only"]
title = "ライセンスの条文のみ（提供者独自の規約なし）"
url = ""                     # SOURCE.toml の license_url（ライセンスの条文）をそのまま使う
base_license = "*"
non_copyrightable = "excluded"   # 著作権ライセンスなので、著作物でなければ条件は及ばない
indemnity = false
deemed_consent = false
unilateral_change = false

[terms."jp-pdl-1.0"]
title = "公共データ利用規約（第1.0版）"
url = "https://www.digital.go.jp/resources/open_data/public_data_license_v1.0"
base_license = "LicenseRef-jp-PDL-1.0"
non_copyrightable = "excluded"   # 「数値データ、簡単な表・グラフ等は…本利用ルールの適用はなく、自由に利用できます」
indemnity = false                # 本文に弁償・求償の条項なし（1.6 は提供者の免責のみ）。2026-11-21 確認
deemed_consent = true
unilateral_change = true

[terms."jp-gov-std-2.0"]
title = "政府標準利用規約（第2.0版）"
url = "https://www.digital.go.jp/resources/open_data"
base_license = "LicenseRef-jp-gov-std-2.0"
non_copyrightable = "excluded"   # 解説：第2.0版から著作物でないコンテンツへの適用はない旨を明記
indemnity = false                # 解説の範囲で弁償・求償の条項なし（本文は未読）。2026-11-21 確認
deemed_consent = true
unilateral_change = true

# 著作権法13条（権利の目的とならない著作物）。ライセンスではなく、法律上そもそも著作権の対象外であることを示す。
# 対象は 13条各号（1 法令 / 2 告示・訓令・通達 / 3 判決等 / 4 それらの翻訳物・編集物で国・自治体・独法等が作成するもの）。
# 本文が自由でも、民間事業者が編集・運営する例規集やデータベースの編集物・サイト規約は別問題なので、
# 取得元は [art13] の hosts（公的機関が直接運営するサイト）に限る。
[terms."jp-copyright-art13"]
title = "著作権法第13条（権利の目的とならない著作物）"
url = "https://laws.e-gov.go.jp/law/345AC0000000048"
base_license = "LicenseRef-jp-copyright-art13"
non_copyrightable = "excluded"   # 13条の対象はそもそも著作権の対象外
indemnity = false                # 法律の規定であり、規約ではない
deemed_consent = false
unilateral_change = false        # 法改正はあり得る

[terms."tokyo-opendata-2017"]
title = "東京都オープンデータ利用規約（2017年3月24日）"
url = "https://portal.data.metro.tokyo.lg.jp/terms/"
base_license = "CC-BY-4.0"
non_copyrightable = "applies"    # 「コンテンツ」を本サイトのデータ全体と定義し、著作物でないものを除外していない
indemnity = true                 # 第6条：利用者による第三者の権利侵害等で提供者に生じた費用を利用者が弁償する
deemed_consent = true            # 第1条
unilateral_change = true         # 前文：予告なしに変更することがある

# 許可ライセンス。キーは SPDX 識別子、SPDX にないものは LicenseRef- を付ける。
#   attribution: クレジット表示が必要か（true なら SOURCE.toml の attribution が必須）
#   share_alike: 派生物に同じライセンスを付ける義務があるか
#   offer_derived: 派生物を公開したら派生データ自体の提供義務があるか（ODbL 4.6）
# 非営利限定（NC）と改変禁止（ND）は、二次利用の範囲が狭いので許可していない。

[licenses."CC0-1.0"]
attribution = false
share_alike = false

[licenses."PDDL-1.0"]
attribution = false
share_alike = false

[licenses."CC-BY-4.0"]
attribution = true
share_alike = false

[licenses."CC-BY-SA-4.0"]
attribution = true
share_alike = true

[licenses."ODC-By-1.0"]
attribution = true
share_alike = false

[licenses."ODbL-1.0"]
attribution = true
share_alike = true
offer_derived = true

# 政府標準利用規約（第2.0版）。CC BY 4.0 互換。e-Stat など各府省のサイトで使われる。
[licenses."LicenseRef-jp-gov-std-2.0"]
attribution = true
share_alike = false

# 公共データ利用規約（第1.0版）（PDL1.0）。CC BY 4.0 互換。
[licenses."LicenseRef-jp-PDL-1.0"]
attribution = true
share_alike = false

# 著作権法13条により権利の目的とならない著作物（法令・告示・判決など）。ライセンスではないが、REUSE が
# ファイルごとの識別子を要求するので LicenseRef として扱う。本文は LICENSES/LicenseRef-jp-copyright-art13.txt。
# クレジット表示の法的義務はない（attribution = false）。出典は書くことを推奨する。
[licenses."LicenseRef-jp-copyright-art13"]
attribution = false
share_alike = false

[licenses."MIT"]
attribution = true
share_alike = false

[licenses."Apache-2.0"]
attribution = true
share_alike = false

[licenses."BSD-3-Clause"]
attribution = true
share_alike = false
