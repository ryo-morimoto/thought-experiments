# データを置くディレクトリにこのファイルをコピーして埋める。
# 同じディレクトリとその下のデータファイルすべてに、この宣言が適用される。
# 埋めたら `python3 tools/fetch_evidence.py <ディレクトリ>` で証拠を取り、
# `python3 tools/check_data_policy.py --fix` で REUSE.toml と NOTICE.md を生成する。

id = "example-dataset"            # リポジトリ内で一意。derived_from から参照される
title = "データセットの名前"
origin = "external"               # external | derived | original

# --- origin = "external" のとき ---
publisher = "提供者（組織名など）"            # REUSE の著作権表示にも使う
publisher_type = "local-government"           # data-policy.toml の publisher_types のキー
url = "https://example.org/dataset"           # データを取得した公開ページ
license = "CC-BY-4.0"                         # 宣言値（declared）: data-policy.toml の licenses のキー
license_url = "https://creativecommons.org/licenses/by/4.0/legalcode.ja"  # ライセンス・利用規約の本文
terms = "cc-license-only"                     # data-policy.toml の [terms] のキー。提供者独自の規約があれば登録して指定する
attribution = "出典：提供者「データセットの名前」(https://example.org/dataset)"  # ライセンスが求める表記
modified = false                              # 加工したら true
# modifications = "2020年以降の行だけを抽出し、列名を英語に変更（加工：ryo-morimoto）"  # modified = true なら必須
# committed = false   # リポジトリに含めない場合。取得は DVC の import-url などで再現できるようにする
# archive_note = "…"  # Internet Archive に保存できない、または保存内容が手元と一致しない事情（動的なページなど）

# 確認値（concluded）: 自分で規約を読んで確かめた結果。宣言値と食い違うなら使わない。
[concluded]
license = "CC-BY-4.0"
by = "ryo-morimoto"
at = 2026-11-20
basis = ["terms-page"]                        # 根拠: terms-page, catalog, license-file など
third_party = "none-indicated"                # 第三者の権利がある部分の表示がないことを確認した。あればリストで書く（その場合は使えない）
# third_party_note = "「©」は提供者自身の著作権表示"  # fetch_evidence.py が第三者の権利を示す語を見つけたときに書く

# 任意: 提供者の機械可読カタログとの突き合わせ（fetch_evidence.py が照合する）
# [catalog]
# type = "ckan"                               # ckan | datacite
# url = "https://catalog.data.metro.tokyo.lg.jp/api/3/action/package_show?id=..."  # datacite なら DOI を書く
# accept_mismatch = "カタログの表記が古いため。規約ページで確認済み"  # 不一致を承知で使う場合の理由

# --- 法令・告示・判決など（著作権法13条により権利の目的とならない著作物）のとき ---
# license = "LicenseRef-jp-copyright-art13"
# license_url = "https://laws.e-gov.go.jp/law/345AC0000000048"
# terms = "jp-copyright-art13"
# art13_item = 1                 # 1 法令（条例を含む）/ 2 告示・訓令・通達 / 3 判決等 / 4 国等が作成した翻訳物・編集物
# publisher_type = "local-government"   # 国・地方公共団体の機関、独立行政法人等に限る
# url は data-policy.toml の [art13.hosts] にあるホスト（公的機関が直接運営するサイト）から取得したものに限る
# 初めて使うときは cp templates/LICENSES/LicenseRef-jp-copyright-art13.txt LICENSES/
# attribution は義務ではないが、出典として書くことを推奨する

# --- origin = "derived" のとき ---
# derived_from = ["example-dataset"]
# license = "CC-BY-4.0"   # 元データが SA なら同じライセンス、BY 系なら表示義務のあるライセンスにする
