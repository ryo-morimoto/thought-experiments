note = "36 の性質の 83 の概念を仕様に対応づけた。食い違い 4 つは直した書き方を PremisesFix.tla で確かめた（本体への取り込みは F7）。定義の無いものは分析の定義と外部の仕様として印をつけた"
evidence = ["experiments/models/site-isolation/fixes/FIXES.md", "experiments/models/site-isolation/premises/RESULTS.md"]

[[node]]
