note = "オリジンはデータ独立の議論で条件つきで移せ（Key と不透明なオリジンを使わない性質に限る）、深さはリダイレクト 2 段・入れ子 3 段で飽和した。生成した筋書きの空間に関係の型の穴がある。段階C が未"

