# 作業の木の正本。手で編集するのはこのファイルだけ。TREE.md は `python3 tools/plan.py render` が生成する。
# 根拠は、思考実験の記録の見出しにある「- 木の節: browser-semantics-soundness/<id>」から集める（ここに二重に書かない）。
# 記録以外の根拠（調査の覚え書き、モデルのディレクトリ）だけを evidence に書く。
# status は葉にだけ書く（done、partial、todo、out、parked）。子を持つ節の状態は子から計算する。
# impact は、葉が根の答えをどれだけ強くするか（high、mid、low）。次の候補の順に使う。

[meta]
name = "browser-semantics-soundness"
question = "ブラウザの意味論から検証モデルへの変換に、健全性の根拠を与えることができるか"
answer = "厳密な健全性は、(a) 仕様（WHATWG の HTML・Fetch の固定したコミット）にも (b) 出荷中のブラウザにも無い。残る仕事は、厳密でない根拠を、どの条件のもとでどこまで強くできるかを示すこと。根拠は、A（モデルの中）、B（仕様 ⊆ モデル）、C（ブラウザ ⊆ モデル）が揃って初めて立つ"
created = "2026-11-24"

[[node]]
id = "ROOT"
title = "モデル ⊨ P ⇒ 対象 ⊨ P の根拠（対象は仕様と出荷中のブラウザ）"

