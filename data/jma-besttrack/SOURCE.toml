# zip のまま置く。取得元とバイト単位で同一なので、証拠（sha256・Internet Archive）と直接照合できる。
# 展開すると bst_all.txt（約 6MB）。分析は zipfile で直接読む。
# 形式（https://www.jma.go.jp/jma/jma-eng/jma-center/rsmc-hp-pub-eg/Besttracks/e_format_bst.html ）:
#   固定長の ASCII。台風ごとにヘッダ行（先頭 "66666"、国際番号、データ行数、名前、最終改訂日）と、
#   6時間ごとなどのデータ行（解析時刻 yymmddhh UTC、階級 2〜9、緯度・経度 0.1度単位、中心気圧 hPa、
#   最大風速 kt、50kt/30kt 暴風域、上陸・通過の印）が続く。
# 最大風速は 1977年以降だけ値がある（1976年以前は全データ行で 0 か空欄。取得したデータで確認）。
# 1951〜2026年（2026年は年の途中）。過去分も再解析で改訂される（修正履歴:
#   https://www.jma.go.jp/jma/jma-eng/jma-center/rsmc-hp-pub-eg/Besttracks/history_of_revision.csv ）。

