next_question = "設計文書の項目の下に共通する「主体の計算」を、設計の段の不変条件として書けるか"

[[cells]]
row = "impl"
col = "mandatory"
status = "supported"
claim = "既知のバグに合わせずに作った仕様由来の判定基準が後づけと同じ 4 件を「予測した」とは言えない（結果を決めた選択はバグを見たあと）。試験の筋書きが入力を独立に与える「試験の時の判定基準」としてなら、仕様の段で判定できる場合がある（CVE-2024-1671 は get session history entries の選び方でモデルが捕まえた）。ブラウザの状態を入力にするコミット時の差分検査は、同じ誤りを共有し、既存の検査を超える効き目がほとんど無い。事前登録した試験では、取り置きのバグ 15 件のうち 10 件で判定に要る仕様の算法が事前に固定した集合に入っていたが、無作為な根の閉包でも中央値で同じ 10 件になり（navigate が呼び出しの要）、この規則では予測の力を測れなかった。実際の試験に書けた 3 件は、直る前のブラウザでも通り、バグを見つけなかった（判定基準は値の決まりを与えるが、バグの引き金は与えない）"
evidence = [
  "experiments/2026-11-21-blind-origin-oracle.md",
  "experiments/prereg/2026-11-21-origin-oracle.md",
  "experiments/models/site-isolation/OriginOracle.tla",
  "experiments/models/site-isolation/NestedHistory.tla",
]
mode = "destructive"
next_question = "仕様由来の判定基準に、バグの引き金を探す手段（ファジング、状態の探索）を組み合わせると、直る前のブラウザで見つけられるか"

[[cells]]
row = "fsp"
col = "mandatory"
status = "supported"
claim = "WHATWG の仕様は Common Criteria の意味での評価対象の機能仕様にはならず、非形式の参照にとどまる。その対応の根拠は、モデルが扱う性質に関わる段がモデルに写っていることの非形式の提示で、良し悪しは段の数え上げではなく、落とした段を足して性質が変わるかで確かめる。実際に「安全でない文脈の COEP」の 1 段で OptInOnly が偽になり、その欠落は WPT の 109 件に捕まらなかった"
evidence = [
  "experiments/2026-11-21-fsp-correspondence.md",
