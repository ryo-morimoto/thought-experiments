col = "mandatory"
status = "supported"
claim = "設計文書（compromised-renderers.md）は資源の種類ごとに保護と既知の穴を並べているが、証拠の種類や主体の欄は無い。サイト分離の回避 39 件のうち、1 項目に収まるのは 26 件、項目をまたぐのが 7 件、対応する項目が無いのが 6 件で、文書の既知の穴にちょうど入ったものは 0 件だった。設計を基準点にしても、段ごとの網羅は文書に担保されない"
