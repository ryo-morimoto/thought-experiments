title = "ブラウザの意味論から検証モデルへの変換の根拠"
question = "ブラウザの意味論（WHATWG の散文の仕様と、独立に作られたブラウザ）から検証モデルへの変換に、健全性の根拠を与えられるか"

[rows]
name = "何に対する健全性か"
