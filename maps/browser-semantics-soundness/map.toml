# 思考実験の地図。生成: python3 <skill>/scripts/thought_map.py render maps/browser-semantics-soundness
# 軸の選び方と捨てた候補: research_notes/browser-semantics-soundness-map/axes.md

title = "ブラウザの意味論から検証モデルへの変換の根拠"
question = "ブラウザの意味論（WHATWG の散文の仕様と、独立に作られたブラウザ）から検証モデルへの変換に、健全性の根拠を与えられるか。この地図は仕様の側（仕様をどこまで形式的に書けば、何が言えるか）を扱い、実装の側は地図 browser-implementation-correspondence が扱う"

[rows]
name = "仕様の形式性"
basis = "standard"
ref = "https://www.commoncriteriaportal.org/files/ccfiles/CCPART1V3.1R5.pdf"
ref_title = "Common Criteria for Information Technology Security Evaluation, Part 1, v3.1 R5（ISO/IEC 15408-1 相当）の用語集 formal / semiformal / informal"
ref_read = true
note = "本文の用語集で定義を確かめた（2026-11-21）。仕様をどう書いたかの区別で、どの段（仕様か実装か）かの区別は地図 browser-implementation-correspondence の行に分けた"

[[rows.values]]
id = "informal"
name = "非形式（自然言語）"
note = "expressed in natural language（CC Part 1 の 55）。WHATWG の HTML・Fetch の原稿をそのまま読んで手でモデルに写す場合"

[[rows.values]]
id = "semiformal"
name = "半形式"
note = "expressed in a restricted syntax language with defined semantics（CC Part 1 の 84）。原稿の算法を段の決まった形（Let、If … return など）として機械的に取り出した場合が、ここを目指すもの。ただし取り出しでは、段の形は限られても条件の文の意味は定まらない"

[[rows.values]]
id = "formal"
name = "形式"
note = "restricted syntax with defined semantics based on well-established mathematical concepts（CC Part 1 の 52）。形式的な記述を元に、散文や参照実装を生成する仕様（Wasm の SpecTec の方式）。WHATWG には今のところ無い"

[cols]
name = "仕様の中身の種類"
basis = "standard"
ref = "https://www.w3.org/TR/qaframe-spec/"
ref_title = "W3C QA Framework: Specification Guidelines（W3C Recommendation 2005）の 2.3.2 What is mandatory? と 2.4 Managing Variability"
ref_read = true
note = "本文で定義を確かめた（2026-11-21）。2.4.1 の profile・module・level は WHATWG の Living Standard に無いので除いた。並行（in parallel）やタスクの投入は、この分類に無い（軸の欠け。research_notes の axes.md を参照）"

[[cols.values]]
id = "mandatory"
name = "必須"
note = "すべての実装が従う決まった要求（2.3.2）。WHATWG では、決まった形の算法の段がほとんどこれにあたる"

[[cols.values]]
id = "opt-feature"
name = "機能を支援するかの選択"
note = "よく定義された機能を支援するかしないかを実装が選べる（2.4.2 の options の 1 つ目）"

[[cols.values]]
id = "opt-enum"
name = "列挙した選択肢からの選択"
note = "列挙された値や振る舞いから実装が選ぶ（2.4.2 の 2 つ目）。例: cross-origin isolation を logical と concrete のどちらにするか"

[[cols.values]]
id = "opt-impl"
name = "実装依存の値・振る舞い"
note = "値や振る舞いを実装に任せる（2.4.2 の 3 つ目、discretionary items）。WHATWG の implementation-defined、optionally、user agent may など"

[[cols.values]]
id = "extension"
name = "拡張"
note = "他の仕様や実装が振る舞いを足せる点（2.4.3）。WHATWG では「applicable specifications」や他の仕様からの差し込み"

[[cols.values]]
id = "deprecation"
name = "廃止予定"
note = "廃止予定の機能と、その扱い（2.4.4）"

[[cols.values]]
id = "error"
name = "誤りの扱い"
note = "誤った入力や状態に対する振る舞い（2.4.5）"

[[cells]]
row = "informal"
col = "mandatory"
status = "supported"
claim = "手書きのモデルでは、散文からモデルへの橋は反証可能な仮説にとどまる。WPT の 109 件はモデルの段の欠落を 1 つ捕まえたが、もう 1 つ（COEP allows credentials）は捕まえず、機械的な誤読でも段の欠落が最も捕まりにくかった（非等価な 21 個中 19 個）。後に足した「安全でない文脈の COEP」の段の欠落は WPT の 109 件に捕まらず、その欠落のせいでアクセス制御としての性質（OptInOnly）が成り立って見えていた"
evidence = [
  "experiments/2026-11-20-browser-semantics-soundness.md",
  "experiments/models/site-isolation/SpecIsolation.tla",
  "experiments/models/site-isolation/WPTBroad.tla",
  "experiments/2026-11-21-fsp-correspondence.md",
]
mode = "destructive"
next_question = "取り出した段の一覧と手書きのモデルを突き合わせ、モデルが落としている段を全部挙げられるか"

[[cells]]
row = "semiformal"
col = "mandatory"
status = "supported"
claim = "隔離に関わる算法の閉包（415 算法、3445 段）の 91.3% は取り出せる形（制限された構文）だが、段の中の条件は自然言語のままで意味が定まらず、半形式の定義を満たしきらない。取り出したものを確かめる独立した判定基準も無い。得られるのは健全性ではなく追跡可能性で、モデルが落とした段は一覧との突き合わせで機械的に見つかる（実際の 2 つの欠落はどちらも取り出され、根から到達できた）"
evidence = [
  "experiments/2026-11-20-browser-semantics-soundness.md",
  "experiments/models/site-isolation/extract/README.md",
]
mode = "destructive"
next_question = "取り出した参照を実行できる形にし、WPT と突き合わせられるか（ESMeta と test262 の関係を作れるか）"

[[cells]]
row = "semiformal"
col = "opt-enum"
status = "supported"
claim = "取り出せない段の過半（53%）が、オリジン・COOP・CORP・COEP を決める部分にあり、logical と concrete の選択やブラウジングコンテキストグループの任意の切り替えのように、隔離を決める段そのものが実装の選択になっている。非決定として過近似すると安全性は保てるが、情報流は保てず、性質を示すには粗すぎる"
evidence = [
  "experiments/2026-11-20-browser-semantics-soundness.md",
  "experiments/models/site-isolation/extract/README.md",
  "https://www.cs.cornell.edu/fbs/publications/Hyperproperties.pdf",
]
mode = "destructive"
next_question = "実装の選択を、ブラウザごとの選び方で埋めたとき、過近似はどこまで細かくなるか"

[[cells]]
row = "informal"
col = "opt-impl"
status = "supported"
claim = "WHATWG の implementation-defined には、C 言語の規格のような文書化の区別が無い（Infra の定義を確認）。モデルでの扱いは、何に裁量があるかで分ける: 値と構造はパラメータ、実行時の方策は安全性なら非決定・情報流なら方策のクラスを限ったパラメータ、仕様の欠落は対象外"
evidence = [
  "experiments/2026-11-20-browser-semantics-soundness.md",
  "https://infra.spec.whatwg.org/",
]
mode = "constructive"
next_question = "HTML の implementation-defined の全件を、値・構造・方策・欠落に分けるとどうなるか"

[[cells]]
row = "semiformal"
col = "extension"
status = "supported"
claim = "他の仕様から HTML・Fetch への差し込みは、HTML と Fetch の原稿には現れない（「applicable specifications」が 10 箇所あるだけ）。呼び出しの閉包の境界は手で選ぶしかなく、仕様を丸ごと落としうる"
evidence = [
  "experiments/2026-11-20-browser-semantics-soundness.md",
  "experiments/models/site-isolation/extract/README.md",
]
mode = "destructive"
next_question = "Service Workers・CSP・Storage などを閉包に入れると、残りと境界はどう変わるか"

[[cells]]
row = "formal"
col = "mandatory"
status = "supported"
claim = "厳密な健全性はいつも何かの形式的な成果物に対して立つので、区別になるのはその成果物が正文かどうか。正文が形式的か、証明に使う成果物から機械的に生成されるとき（Arm の ASL、SpecTec 以後の Wasm）、または正文との間に検証つきの変換があるときだけ、仕様に対する厳密な健全性に届き、信頼は生成器・証明系・DSL の意味に残る。HTML は並行の段などを書ける形式言語がまだ無く、この行に入れない"
evidence = [
  "experiments/2026-11-21-formal-source-soundness.md",
  "https://webassembly.org/news/2025-03-27-spectec/",
  "https://vtss.doc.ic.ac.uk/research/webassembly.html",
]
mode = "destructive"
next_question = "正文の一部（Fetch の CORP の検査やオリジンの計算）だけを形式的な元から生成する案は成り立つか"
