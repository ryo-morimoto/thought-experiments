# 最初の調査（reports/データライセンス準拠ツールの限界.md）を地図にしたもの。
title = "データのライセンス準拠は、誰がどこまで保証できるか"
question = "外部データを使うとき、ライセンス準拠のどの性質を、どの立場の者が、どこまで保証できるか"

[rows]
name = "保証したい性質"
basis = "own"
ref = "reports/データライセンス準拠ツールの限界.md"
ref_title = "既存ツールは層①までしか守れない"
ref_read = true
note = "最初の調査の依頼文で定義した 3 層と、条件付き証明の 3 要件。"

[[rows.values]]
id = "L1"
name = "層① 内部整合"
note = "宣言とリポジトリの中身が一致している"

[[rows.values]]
id = "L2"
name = "層② 事実整合・権利者性"
note = "宣言が現実と一致し、提供者が権利者である"

[[rows.values]]
id = "L3"
name = "層③ 法的評価"
note = "その利用が法的に許される"

[[rows.values]]
id = "cover"
name = "網羅性"
note = "宣言されていないデータがない"

[[rows.values]]
id = "faith"
name = "忠実性"
note = "検査規則が実際のライセンス義務を含意する"

[[rows.values]]
id = "evid"
name = "証拠保全"
note = "当時の条項と中身の版を残している"

[cols]
name = "適合性評価の主体"
basis = "standard"
ref = "https://www.nist.gov/glossary-term/47956"
ref_title = "ISO/IEC 17000:2020（NIST OSAC Lexicon の転載）"
ref_read = false
note = "第一者・第二者の定義は 2020 年版の転載で確認した。第三者は 2014 年版の転載しか見ていない。ISO の本文は有償。"

[[cols.values]]
id = "first"
name = "第一者（提供者）"

[[cols.values]]
id = "second"
name = "第二者（利用者）"

[[cols.values]]
id = "third"
name = "第三者（独立）"

[[cells]]
row = "L1"
col = "second"
status = "supported"
claim = "利用者は自分のリポジトリについて層①を機械的に検査できる。REUSE と自作チェッカーで全ファイルの宣言と本文の揃いを見られる。"
evidence = ["reports/データライセンス準拠ツールの限界.md", "tools/check_data_policy.py"]

[[cells]]
row = "L1"
col = "third"
status = "supported"
claim = "第三者も層①は再現できる。検査が決定的なので、CI の attestation で結果を第三者が検証できる。ClearlyDefined は上流パッケージの層①をキュレーションしている。"
evidence = ["reports/データライセンス準拠ツールの限界.md", ".github/workflows/attest.yml"]

[[cells]]
row = "L2"
col = "first"
status = "refuted"
claim = "提供者の自己申告は層②の証拠にならない。アグリゲータ上のライセンス表示が DPI の判定と一致するのは 35〜54% で、誤りは緩い方向に偏る。"
evidence = ["reports/データライセンス準拠ツールの限界.md", "https://arxiv.org/abs/2310.16787"]

[[cells]]
row = "L2"
col = "second"
status = "hypothesis"
claim = "利用者は層②を証明できないが、提供者を説明責任を負う組織に限ることで、誤表示を受け取る確率は下げられる。"
evidence = ["data-policy.toml"]
next_question = "公的機関の公開データにも誤表示はどのくらいあるか。確率を下げる効果は測れるか。"

[[cells]]
row = "L2"
col = "third"
status = "supported"
claim = "層②に届くのは人手の第三者だけで、それも部分的である（Wikimedia Commons の License review、DPI の再アノテーション）。機械は「URL が T にこの内容を返した」という観測までしか届かない。"
evidence = ["reports/データライセンス準拠ツールの限界.md"]

[[cells]]
row = "L3"
col = "second"
status = "supported"
claim = "ツールは層③を利用者が書く規則に委ねる（ORT の evaluator rules は例示にすぎない）。"
evidence = ["reports/データライセンス準拠ツールの限界.md"]

[[cells]]
row = "L3"
col = "third"
status = "hypothesis"
claim = "層③を保証できるのは法務の第三者判断だけだが、その判断も個別の利用に閉じていて、データセットの性質としては残らない。"

[[cells]]
row = "cover"
col = "second"
status = "supported"
claim = "利用者の網羅性検査は「宣言があるか」までしか測れない。スキャナの再現率は約 0.79 で頭打ちになる。自作物を許可リストで定義すると、拡張子の偽装はふさげる。"
evidence = ["reports/データライセンス準拠ツールの限界.md", "data-policy.toml"]

[[cells]]
row = "faith"
col = "second"
status = "hypothesis"
claim = "許可リストと SA の系譜検査は、利用者が自分で選んだ範囲では義務を含意する。ただし義務の判断そのものは人手で、形式的な裏付けはない。"
evidence = ["data-policy.toml", "tools/check_data_policy.py"]

[[cells]]
row = "faith"
col = "third"
status = "supported"
claim = "第三者が提供する標準化された義務評価エンジンは存在しない。ODRL の形式意味論は 2026 年時点でドラフトにとどまる。"
evidence = ["reports/データライセンス準拠ツールの限界.md"]

[[cells]]
row = "evid"
col = "second"
status = "open"
next_question = "取得時のハッシュ・RFC 3161 タイムスタンプ・Wayback を足したことで、利用者が後から示せるのはどこまでか。"
evidence = ["tools/fetch_evidence.py"]

[[cells]]
row = "evid"
col = "third"
status = "supported"
claim = "第三者の証拠は「T 以前にこのバイト列が存在した」「T ごろにこの URL がこの内容を返した」で止まり、権利の真正性には届かない。運営者への信頼にも依存する。"
evidence = ["reports/データライセンス準拠ツールの限界.md"]
